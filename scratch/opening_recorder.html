<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
:root {
  --bg: #070708;
  --bg2: #0f1114;
  --bg3: #191b20;
  --t1: rgba(245,241,234,.95);
  --ease-open: cubic-bezier(.22,1,.36,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body, html { width:100%; height:100%; overflow:hidden; background:#070708; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }

#sp {
  position:fixed;
  inset:0;
  z-index:9999;
  background:
    radial-gradient(circle at 50% 26%, rgba(126,96,255,.22), transparent 30%),
    radial-gradient(circle at 22% 70%, rgba(84,170,255,.16), transparent 28%),
    radial-gradient(circle at 78% 72%, rgba(255,176,92,.14), transparent 26%),
    linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 42%, var(--bg) 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  overflow:hidden;
}

.sp-ring {
  width: 140px;
  height: 140px;
  border-radius: 38px;
  background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  color: var(--t1);
  box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 20px 40px rgba(0,0,0,.35), 0 0 32px rgba(126,96,255,.16), inset 0 1px 0 rgba(255,255,255,.24);
  transform-origin: center center;
  will-change: transform, opacity;
}

.sp-name {
  font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--t1);
  text-shadow: 0 0 30px rgba(126,96,255,.25), 0 4px 12px rgba(0,0,0,.4);
  margin-top: 4px;
}

.sp-tag {
  font-size: 11px;
  font-weight: 600;
  color: rgba(230,236,244,.65);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: -6px;
}

.sp-dots {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.sp-d {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(126,96,255,.95), rgba(84,170,255,.9));
  box-shadow: 0 0 10px rgba(126,96,255,.3);
}

/* Precise manual frame driver */
</style>
</head>
<body>
<div id="sp">
  <div class="sp-ring" id="ring">∿</div>
  <div class="sp-name" id="name">CALVERSE</div>
  <div class="sp-tag" id="tag">Dark Academia Study Companion</div>
  <div class="sp-dots" id="dots">
    <div class="sp-d" id="d1"></div>
    <div class="sp-d" id="d2"></div>
    <div class="sp-d" id="d3"></div>
  </div>
</div>

<script>
// We provide a frame seek function window.seekFrame(progress 0..1)
const ring = document.getElementById('ring');
const nameEl = document.getElementById('name');
const tag = document.getElementById('tag');
const dots = document.getElementById('dots');
const d1 = document.getElementById('d1');
const d2 = document.getElementById('d2');
const d3 = document.getElementById('d3');
const sp = document.getElementById('sp');

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOutQuad(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

window.seekTime = function(t) {
  // t in seconds from 0 to 2.4s
  // Phase 1: 0 to 0.7s - Ring enters
  if (t < 0.7) {
    const p = Math.min(1, Math.max(0, t / 0.7));
    const ease = easeOutCubic(p);
    const ty = (1 - ease) * 30;
    const rot = (1 - ease) * -6;
    ring.style.opacity = ease;
    ring.style.transform = `translateY(${ty}px) rotate(${rot}deg) scale(1)`;
  } else if (t < 1.1) {
    // Phase 2: resting hovering
    const p = (t - 0.7) / 0.4;
    const hoverY = Math.sin(p * Math.PI) * -3;
    ring.style.opacity = 1;
    ring.style.transform = `translateY(${hoverY}px) rotate(0deg) scale(1)`;
  } else {
    // Phase 3: Zoom forward transition (1.1s to 2.2s)
    const p = Math.min(1, (t - 1.1) / 0.95);
    const ease = Math.pow(p, 2.5); // accelerating forward
    const scale = 1 + ease * 7.5;
    const op = Math.max(0, 1 - ease * 1.35);
    ring.style.transform = `scale(${scale}) translateY(-4px)`;
    ring.style.opacity = op;
  }

  // Name & tag fade in: 0.3s to 0.85s
  if (t < 0.3) {
    nameEl.style.opacity = 0;
    nameEl.style.transform = 'translateY(14px)';
    tag.style.opacity = 0;
    dots.style.opacity = 0;
  } else if (t < 1.1) {
    const pName = Math.min(1, (t - 0.3) / 0.5);
    const easeN = easeOutCubic(pName);
    nameEl.style.opacity = easeN;
    nameEl.style.transform = `translateY(${(1 - easeN) * 14}px)`;

    const pTag = Math.min(1, Math.max(0, (t - 0.45) / 0.45));
    tag.style.opacity = pTag;
    tag.style.transform = `translateY(${(1 - pTag) * 10}px)`;

    const pDots = Math.min(1, Math.max(0, (t - 0.6) / 0.35));
    dots.style.opacity = pDots;
  } else {
    // Fade out text during zoom portal
    const pOut = Math.min(1, (t - 1.1) / 0.45);
    nameEl.style.opacity = Math.max(0, 1 - pOut);
    tag.style.opacity = Math.max(0, 1 - pOut);
    dots.style.opacity = Math.max(0, 1 - pOut);
  }

  // Dots pulsating
  const dt1 = (Math.sin(t * 5) + 1) / 2;
  const dt2 = (Math.sin(t * 5 + 0.8) + 1) / 2;
  const dt3 = (Math.sin(t * 5 + 1.6) + 1) / 2;
  d1.style.transform = `scale(${0.75 + dt1 * 0.45})`;
  d2.style.transform = `scale(${0.75 + dt2 * 0.45})`;
  d3.style.transform = `scale(${0.75 + dt3 * 0.45})`;

  // Final dissolve of entire canvas at 1.9s - 2.3s
  if (t > 1.9) {
    const pSp = Math.min(1, (t - 1.9) / 0.4);
    sp.style.opacity = Math.max(0, 1 - pSp);
  } else {
    sp.style.opacity = 1;
  }
};
</script>
</body>
</html>
